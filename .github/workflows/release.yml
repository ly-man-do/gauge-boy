name: Release

# Pushing a tag like v0.0.1 builds gauge-boy.3dsx and gauge-boy.cia and publishes
# them on a GitHub release, with gauge-boy-qr.png: an FBI QR code for that
# version's .cia, also shown in the release notes. Asset names never carry a version, so
#   https://github.com/ly-man-do/gauge-boy/releases/latest/download/gauge-boy.cia
# always points at the newest release (the FBI QR install link).
#
# Before tagging: set the version in source/version.h and move the CHANGELOG
# "Unreleased" entries under "## [x.y.z] - date". The run stops if the tag,
# version.h and CHANGELOG disagree.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the tag matches source/version.h
        run: |
          version="$(make -s version)"
          echo "source/version.h: $version, tag: $TAG"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match source/version.h ($version). Expected v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"

      # Same devkitPro image as the Build workflow; run here with docker so the
      # runner's own gh CLI can publish the release afterwards.
      - name: Test and build .3dsx and .cia
        run: |
          docker run --rm -v "$PWD":/src -w /src devkitpro/devkitarm:latest \
            sh -c 'make test && make test-clean && make cia'
          ls -l gauge-boy.3dsx gauge-boy.cia

      # FBI install QR for this version's .cia (segno, hash-pinned, CI only).
      - name: QR code for this release
        run: |
          python3 -m venv "$RUNNER_TEMP/qr-venv"
          "$RUNNER_TEMP/qr-venv/bin/pip" install --quiet --require-hashes -r tools/requirements-release.txt
          "$RUNNER_TEMP/qr-venv/bin/python" tools/make_qr.py --version "$VERSION" --out gauge-boy-qr.png
          {
            echo
            echo "### Install with FBI"
            echo
            echo "![QR code for Gauge Boy $VERSION](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gauge-boy-qr.png)"
            echo
            echo "In FBI choose *Remote Install* > *Scan QR Code* and scan this code to install exactly this version. The QR code in the README always installs the newest release."
          } >> "$RUNNER_TEMP/notes.md"

      # Not a prerelease: releases/latest/download/... only follows full releases.
      # A re-run replaces the assets on the existing release.
      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" gauge-boy.3dsx gauge-boy.cia gauge-boy-qr.png --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" gauge-boy.3dsx gauge-boy.cia gauge-boy-qr.png \
              --verify-tag --title "Gauge Boy $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Check the latest-release links
        run: |
          latest="$(gh release view --json tagName -q .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "::warning::Latest release is $latest, not $TAG; the releases/latest links point there."
            exit 0
          fi
          for f in gauge-boy.3dsx gauge-boy.cia; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$f"
            curl -fsSL -o "$RUNNER_TEMP/$f" "$url"
            cmp "$RUNNER_TEMP/$f" "$f"
            echo "OK $url"
          done
